<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>AI 代码检视 Skill · 团队质量观测站</title>
  <style>
    :root {
      --mist:#eef4f7;--paper:#fff;--ink:#173b43;--muted:#55747c;--line:#cadde2;--soft:#f6fafb;
      --skill:#168c72;--skill-soft:#e3f3ee;--blue:#4d72c9;--blue-soft:#eaf0ff;--amber:#d58a2a;--red:#c85c52;
      --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.6;background:radial-gradient(circle at 8% 4%,rgba(77,114,201,.1),transparent 24rem),radial-gradient(circle at 94% 18%,rgba(22,140,114,.08),transparent 26rem),var(--mist)}
    .shell{width:min(1200px,calc(100% - 48px));margin:auto;padding:24px 0 46px}.masthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;font:700 11px/1 var(--mono);letter-spacing:.08em}.brand{display:flex;gap:9px;align-items:center}.mark{width:24px;height:24px;border:1px solid var(--ink);border-radius:50%;position:relative}.mark:after{content:"";position:absolute;inset:6px;border:3px solid var(--skill);border-radius:50%}.period{color:var(--muted)}
    h1,h2,h3,p{margin-top:0}h1{margin-bottom:9px;font-size:clamp(34px,4.7vw,62px);line-height:1.04;letter-spacing:-.05em}h2{margin-bottom:6px;font-size:clamp(23px,2.6vw,35px);line-height:1.14;letter-spacing:-.03em}h3{margin-bottom:5px;font-size:16px}.eyebrow{margin-bottom:6px;color:var(--skill);font:700 10px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}.lead{margin:0;color:var(--muted);font-size:14px}.section{margin-top:48px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:15px}.section-head>p{margin:0 0 2px;color:var(--muted);font-size:12px}
    .hero{display:grid;grid-template-columns:.92fr 1.08fr;gap:38px;align-items:center}.observatory{padding:38px 28px 22px;border:1px solid var(--line);border-radius:185px 185px 24px 24px;background:rgba(255,255,255,.9);box-shadow:0 16px 48px rgba(33,76,88,.08)}.gauge{--rate:0%;width:148px;height:148px;margin:auto;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--skill) 0 var(--rate),#dfeaec var(--rate) 100%);box-shadow:0 0 0 9px var(--mist)}.gauge:before{content:"";grid-area:1/1;width:108px;height:108px;border-radius:50%;background:white}.gauge span{grid-area:1/1;z-index:1;text-align:center;color:var(--muted);font-size:10px}.gauge b{display:block;color:var(--ink);font:750 29px/1 var(--mono)}.summary-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:22px}.summary-kpis div{padding:9px 4px;border:1px solid #dfebee;border-radius:10px;background:#f8fbfc;text-align:center}.summary-kpis b{display:block;font:750 19px/1.2 var(--mono)}.summary-kpis span{color:var(--muted);font-size:9px}
    .latest-observation{overflow:hidden;border:1px solid rgba(22,140,114,.38);border-radius:22px;background:linear-gradient(135deg,#fff 0%,#edf8f4 100%);box-shadow:0 16px 42px rgba(22,140,114,.08)}.latest-date{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid rgba(22,140,114,.2);background:rgba(22,140,114,.06)}.latest-date span{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--skill)}.latest-date strong{font:750 16px/1 var(--mono)}.latest-date em{padding:3px 7px;border-radius:99px;background:#fff2dc;color:#9a641f;font:700 9px/1 var(--sans)}.latest-content{display:grid;grid-template-columns:.9fr 1.1fr;padding:20px;gap:16px}.latest-lead{margin-bottom:10px;color:var(--muted);font-size:12px}.latest-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;grid-column:1/-1}.latest-metrics div{padding:10px 6px;border:1px solid #dbe9e5;border-radius:10px;background:rgba(255,255,255,.78);text-align:center}.latest-metrics .accent{background:var(--skill);color:#fff}.latest-metrics strong{display:block;font:750 20px/1.15 var(--mono)}.latest-metrics span{font-size:9px;color:var(--muted)}.latest-metrics .accent span{color:#dff7ef}.latest-visuals{display:grid;gap:9px}.visual-row>span{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted);font-size:10px}.visual-row b{color:var(--ink);font-family:var(--mono)}.progress-track,.stacked-track,.team-split-track{display:flex;height:8px;overflow:hidden;border-radius:99px;background:#dce8eb}.progress-track i{display:block;background:var(--skill)}.progress-track.blue i{background:var(--blue)}.stacked-track i.critical{background:var(--red)}.stacked-track i.high{background:var(--amber)}.stacked-track i.medium{background:var(--blue)}.stacked-track i.low{background:#82a6b0}.team-split-track i.front{background:var(--skill)}.team-split-track i.back{background:var(--blue)}.latest-detail{display:grid;gap:8px}.latest-severity{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.latest-severity span{padding:7px 2px;border:1px solid #dbe9e5;border-radius:8px;background:rgba(255,255,255,.7);text-align:center;color:var(--muted);font:9px/1.3 var(--mono)}.latest-severity b{display:block;color:var(--ink);font-size:14px}.latest-teams{display:grid;gap:5px}.latest-team-row{display:grid;grid-template-columns:42px 1fr auto;gap:7px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.7);font-size:10px}.latest-team-row b{font-family:var(--mono)}.latest-team-row em{color:var(--skill);font:700 11px/1 var(--mono)}.delta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.delta-grid div{padding:7px;border-left:2px solid var(--line);background:rgba(255,255,255,.58)}.delta-grid span{display:block;color:var(--muted);font-size:8px}.delta-grid strong{font:750 12px/1.2 var(--mono)}.delta-grid .up{color:var(--skill)}.delta-grid .down{color:var(--red)}.no-compare{margin:12px 0 0;color:var(--muted);font-size:11px}
    .trend-panel{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 12px 34px rgba(33,76,88,.05)}.trend-panel>h3{margin-bottom:1px}.legend{display:flex;gap:15px;margin-bottom:7px;color:var(--muted);font-size:10px}.trend-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:4px}.trend-scroll:focus-visible,.history-scroll:focus-visible{outline:3px solid rgba(77,114,201,.45);outline-offset:3px}.trend-svg{display:block;width:100%;height:auto;max-height:380px}.trend-svg text{font-family:var(--mono)}.chart-grid{stroke:#dfeaec;stroke-width:1}.chart-bar{fill:#cddaf4;stroke:#aac0e8}.chart-bar.latest{fill:#7193dc;stroke:var(--blue)}.bar-label,.date-label{fill:var(--muted);font-size:10px}.track-title{fill:var(--ink);font-size:10px;font-weight:700}.rate-line{fill:none;stroke:var(--skill);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.rate-point{fill:#fff;stroke:var(--skill);stroke-width:3}.rate-point.latest{fill:var(--skill)}.rate-label rect{fill:var(--skill-soft)}.rate-label text{fill:var(--skill);font-size:10px;font-weight:700}
    .severity-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.severity-grid div{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.8)}.severity-grid div:nth-child(1){border-top:3px solid var(--red)}.severity-grid div:nth-child(2){border-top:3px solid var(--amber)}.severity-grid div:nth-child(3){border-top:3px solid var(--blue)}.severity-grid div:nth-child(4){border-top:3px solid #82a6b0}.severity-grid b{display:block;font:750 19px/1.2 var(--mono)}.severity-grid span{color:var(--muted);font-size:9px}
    .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.team-card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:17px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.82)}.team-card>strong{font:750 25px/1 var(--mono)}.team-card>strong small{display:block;margin-top:4px;color:var(--muted);font:400 9px/1 var(--sans)}.team-values{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-column:1/-1}.team-values span{padding:7px;border-left:2px solid var(--skill);background:var(--soft);color:var(--muted);font-size:9px}.team-card.back .team-values span{border-left-color:var(--blue)}.team-values b{display:block;color:var(--ink);font:750 17px/1.2 var(--mono)}.team-card>.progress-track{grid-column:1/-1}
    .history-scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.88)}.history-table{width:100%;min-width:1080px;border-collapse:collapse;font-size:10px;white-space:nowrap}.history-table caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.history-table th,.history-table td{padding:9px 8px;border-bottom:1px solid #e1ebee;text-align:left}.history-table thead th{position:sticky;top:0;z-index:1;background:#e5eff2;color:var(--muted);font:700 9px/1.2 var(--mono)}.history-table tbody tr:last-child>*{border-bottom:0}.history-table tbody tr:nth-child(even){background:rgba(246,250,251,.85)}.history-table tbody tr.latest{background:#e8f6f1}.history-table tbody th{font-family:var(--mono)}.history-date{font-weight:750}.latest-tag{margin-left:6px;padding:2px 5px;border-radius:99px;background:var(--skill);color:#fff;font:700 8px/1 var(--sans)}.rate-cell{min-width:120px}.rate-cell>span{display:block;margin-bottom:3px;font:700 10px/1 var(--mono)}.rate-cell .progress-track{height:5px}.sev-dot{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%}.sev-dot.critical{background:var(--red)}.sev-dot.high{background:var(--amber)}.sev-dot.medium{background:var(--blue)}.sev-dot.low{background:#82a6b0}.no-data{color:var(--muted)}
    .notes{margin-top:36px;padding:16px 19px;border:1px solid #ead9b9;border-radius:14px;background:rgba(255,243,223,.72);color:#765328}.notes h2{font-size:15px;letter-spacing:0}.notes p{margin-bottom:4px;font-size:10px}.notes p:last-child{margin-bottom:0}.page-footer{display:flex;justify-content:space-between;gap:15px;margin-top:20px;color:var(--muted);font-size:9px}
    @media(max-width:960px){.hero{grid-template-columns:1fr}.observatory{width:min(620px,100%);margin:auto}.latest-content{grid-template-columns:1fr}.history-scroll{overflow-x:auto}}
    @media(max-width:640px){.shell{width:calc(100% - 28px);padding-top:18px}.masthead{margin-bottom:26px;font-size:8px}.section{margin-top:42px}.section-head{display:block}.observatory{padding:36px 14px 19px;border-radius:150px 150px 20px 20px}.summary-kpis{grid-template-columns:1fr 1fr}.latest-content{padding:15px}.latest-metrics{grid-template-columns:repeat(2,1fr)}.latest-metrics .accent{grid-column:span 2}.delta-grid,.latest-severity{grid-template-columns:1fr 1fr}.team-grid{grid-template-columns:1fr}.trend-panel{padding:14px 9px}.trend-svg{width:auto;max-height:none}.severity-grid{grid-template-columns:1fr 1fr}.page-footer{display:block}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{@page{size:landscape;margin:8mm}body{background:#fff}.shell{width:100%;padding:0}.observatory,.trend-panel,.latest-observation{box-shadow:none}.section{margin-top:24px;break-inside:avoid}.history-scroll{overflow:visible}.history-table{min-width:0;font-size:7px}.history-table th,.history-table td{padding:4px 3px}}
  </style>
</head>
<body>
  <script id="dashboard-data" type="application/json">{{DASHBOARD_JSON}}</script>
  <main class="shell">
    <header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"></span>AI CODE REVIEW · QUALITY OBSERVATORY</div><div class="period">{{PAGE_PERIOD}}</div></header>
    {{SUMMARY}}
    {{LATEST_SECTION}}
    {{TREND_SECTION}}
    {{SEVERITY_SECTION}}
    {{TEAM_SECTION}}
    {{VERSION_HISTORY}}
    {{DATA_NOTES}}
    <footer class="page-footer"><span>AI Code Review Skill · Team Quality Observatory</span><span>Generated from Markdown</span></footer>
  </main>
  <script>if(matchMedia('(max-width:640px)').matches){document.querySelectorAll('.trend-scroll').forEach(function(node){node.scrollLeft=node.scrollWidth;});}</script>
</body>
</html>
