<!DOCTYPE html>
<!--
  ato-code-review-web · HTML 报告壳模板
  BODY_HTML 章节顺序：一 → 二 → 三 → 四 → 五 → 六 → 七
  每条 issue 须有 id="issue-{ID}"，且含「问题代码」块供弹窗/展开展示。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --text: #0f172a; --text-secondary: #475569; --muted: #64748b;
      --panel: rgba(255,255,255,0.86); --panel-strong: rgba(255,255,255,0.94);
      --panel-soft: rgba(255,255,255,0.72); --panel-border: rgba(203,213,225,0.72);
      --panel-highlight: inset 0 1px 0 rgba(255,255,255,0.86);
      --panel-shadow: 0 3px 14px rgba(15,23,42,0.05), 0 1px 2px rgba(15,23,42,0.04);
      --critical: #dc2626; --high: #ea580c; --medium: #ca8a04; --low: #2563eb;
      --accent: #6366f1; --accent-soft: rgba(99,102,241,0.1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; text-align: left;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 13px; line-height: 1.5; color: var(--text);
      background: #dde3ef;
      background-image:
        radial-gradient(ellipse 90% 70% at 0% 0%, rgba(99,102,241,0.2), transparent 55%),
        radial-gradient(ellipse 70% 55% at 100% 5%, rgba(56,189,248,0.14), transparent 50%),
        linear-gradient(165deg, #e8edff 0%, #f0f9ff 50%, #f4f6fb 100%);
      min-height: 100vh;
    }
    .page { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 20px 16px 36px; }

    header.report-header {
      position: relative; overflow: hidden; padding: 20px 24px; border-radius: 16px; margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%),
        linear-gradient(135deg, rgba(99,102,241,0.78) 0%, rgba(79,70,229,0.85) 50%, rgba(14,165,233,0.68) 100%);
      border: 1px solid rgba(255,255,255,0.46);
      box-shadow: var(--panel-shadow), var(--panel-highlight), 0 10px 28px rgba(99,102,241,0.14); color: #fff;
    }
    header.report-header h1 { margin: 0 0 4px; font-size: 1.28rem; font-weight: 700; letter-spacing: -0.02em; text-align: left; }
    header.report-header .subtitle { opacity: 0.9; font-size: 0.8rem; margin: 0; text-align: left; }

    .meta-cards {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px;
    }
    .meta-card {
      padding: 8px 10px; border-radius: 10px; background: var(--panel-strong);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow), var(--panel-highlight);
    }
    .meta-card .label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; }
    .meta-card .value { font-size: 0.88rem; font-weight: 700; margin-top: 1px; }
    .meta-card.mustfix .label,
    .meta-card.mustfix .value { color: var(--critical); }
    .meta-card.mustfix .label { font-weight: 700; }

    nav.toc {
      padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; background: var(--panel);
      border: 1px solid var(--panel-border); box-shadow: var(--panel-shadow);
    }
    nav.toc h2 { display: none; }
    nav.toc ol {
      margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px;
      counter-reset: toc;
    }
    nav.toc ol li { counter-increment: toc; }
    nav.toc a {
      display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.74rem; font-weight: 500;
      padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); border: 1px solid rgba(99,102,241,0.1);
    }
    nav.toc a::before { content: counter(toc) ". "; opacity: 0.65; font-weight: 600; }
    nav.toc a:hover { background: rgba(99,102,241,0.16); }

    main.report-body {
      padding: 14px 16px; border-radius: 16px; background: var(--panel-strong);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow), var(--panel-highlight);
      display: flex; flex-direction: column; gap: 10px;
    }

    .section-head { display: none; }

    /* ── 折叠面板（全部大标题） ── */
    details.collapse-panel, details.collapse-sub {
      border-radius: 11px; background: var(--panel-soft);
      border: 1px solid rgba(203,213,225,0.62);
      box-shadow: var(--panel-highlight); overflow: hidden;
    }
    details.collapse-sub { margin-top: 6px; background: rgba(255,255,255,0.64); }
    details.collapse-panel > summary, details.collapse-sub > summary {
      padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 0.86rem;
      list-style: none;
      display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center;
      user-select: none; text-align: left;
    }
    details.collapse-panel > summary::-webkit-details-marker,
    details.collapse-sub > summary::-webkit-details-marker { display: none; }
    details.collapse-panel > summary::before,
    details.collapse-sub > summary::before {
      content: ""; width: 5px; height: 5px; border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg);
      transition: transform 0.18s; justify-self: center;
    }
    details.collapse-panel[open] > summary::before,
    details.collapse-sub[open] > summary::before { transform: rotate(45deg); }
    .collapse-meta { font-size: 0.7rem; font-weight: 500; color: var(--muted); }
    .collapse-count { font-size: 0.66rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .collapse-body { padding: 0 12px 10px; border-top: 1px solid rgba(148,163,184,0.1); }
    details.collapse-panel > .collapse-body { padding-top: 8px; }

    /* 一、基本信息：两列键值 */
    dl.info-grid {
      display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 16px;
      margin: 0; font-size: 0.8rem;
    }
    dl.info-grid dt { color: var(--muted); font-weight: 500; white-space: nowrap; }
    dl.info-grid dd { margin: 0; }

    section.summary .stat-grid,
    .stat-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
    }
    .summary-compact { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .summary-compact .stat-grid { flex: 1 1 280px; min-width: 0; }
    .summary-side { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .summary-kpi {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.55); font-size: 0.78rem;
    }
    .summary-kpi strong { font-size: 1.1rem; font-weight: 700; }
    .stat-chip {
      text-align: left; padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.55);
    }
    .stat-chip .num { font-size: 1.2rem; font-weight: 700; line-height: 1.15; }
    .stat-chip .lbl { font-size: 0.64rem; color: var(--muted); margin-top: 2px; }
    .stat-chip.critical .num { color: var(--critical); }
    .stat-chip.high .num { color: var(--high); }
    .stat-chip.medium .num { color: var(--medium); }
    .stat-chip.low .num { color: var(--low); }

    table.zebra { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.78rem; border-radius: 9px; overflow: hidden; }
    table.zebra.compact th, table.zebra.compact td { padding: 5px 8px; }
    table.zebra th, table.zebra td {
      padding: 6px 9px; text-align: left; vertical-align: middle;
      border-bottom: 1px solid rgba(148,163,184,0.1);
    }
    table.zebra th { background: rgba(241,245,249,0.75); font-weight: 600; color: var(--muted); font-size: 0.66rem; text-transform: uppercase; }
    table.zebra tbody tr { background: rgba(255,255,255,0.28); }
    table.zebra tbody tr:hover { background: rgba(255,255,255,0.5); }
    .table-wrap { overflow-x: auto; border-radius: 9px; border: 1px solid rgba(148,163,184,0.08); }

    .sev-critical { color: var(--critical); font-weight: 600; }
    .sev-high { color: var(--high); font-weight: 600; }
    .sev-medium { color: var(--medium); }
    .sev-low { color: var(--low); }
    .badge-mustfix {
      font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 999px;
      background: rgba(220,38,38,0.1); color: var(--critical); border: 1px solid rgba(220,38,38,0.18);
    }

    /* 六、问题清单（含提交人列） */
    #section-issues .collapse-body { overflow-x: auto; }
    .issue-list { display: flex; flex-direction: column; gap: 5px; min-width: 860px; }
    .issue-list-header {
      display: grid;
      grid-template-columns: 14px 28px 64px minmax(108px,1.5fr) minmax(56px,1fr) minmax(52px,0.85fr) 24px 28px 38px 38px minmax(88px,1.8fr) 24px;
      gap: 6px 10px; padding: 6px 10px; font-size: 0.64rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em;
    }
    .issue-list-header span:nth-child(1),
    .issue-list-header span:nth-child(12) { visibility: hidden; }
    details.issue-row {
      border-radius: 10px; background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.52); overflow: hidden;
    }
    details.issue-row.row-mustfix { background: rgba(254,243,199,0.28); border-color: rgba(251,191,36,0.25); }
    details.issue-row.row-valid { box-shadow: inset 3px 0 0 rgba(99,102,241,0.45); }
    details.issue-row.row-fixed { box-shadow: inset 3px 0 0 rgba(34,197,94,0.5); }
    details.issue-row > summary {
      list-style: none; cursor: pointer; padding: 9px 10px; text-align: left;
      display: grid;
      grid-template-columns: 14px 28px 64px minmax(108px,1.5fr) minmax(56px,1fr) minmax(52px,0.85fr) 24px 28px 38px 38px minmax(88px,1.8fr) 24px;
      gap: 6px 10px; align-items: center; font-size: 0.76rem; line-height: 1.35;
    }
    details.issue-row > summary::-webkit-details-marker { display: none; }
    details.issue-row > summary::before {
      content: ""; width: 5px; height: 5px; border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg);
      transition: transform 0.18s; justify-self: center;
    }
    details.issue-row[open] > summary::before { transform: rotate(45deg); }
    details.issue-row > summary .btn-detail { grid-column: 12; justify-self: end; }
    .col-clip {
      display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .issue-row .col-author { color: var(--text-secondary); font-size: 0.7rem; }
    .col-chk { display: flex; align-items: center; justify-content: center; min-width: 0; }
    .chk-label {
      display: inline-flex; align-items: center; gap: 2px; font-size: 0.62rem;
      color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .chk-label input { width: 12px; height: 12px; margin: 0; cursor: pointer; accent-color: var(--accent); }
    .issue-row .col-id { font-weight: 700; font-family: ui-monospace, Menlo, monospace; font-size: 0.74rem; }
    .issue-row .col-index { color: var(--muted); text-align: center; font-size: 0.68rem; }
    .issue-row .col-loc { color: var(--text-secondary); }
    .issue-row .col-fn { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem; }
    .issue-row .col-sev { font-weight: 700; font-size: 0.7rem; text-align: center; }
    .issue-row .col-must { font-size: 0.64rem; color: var(--muted); text-align: center; }
    .issue-row .col-must.yes { color: var(--critical); font-weight: 700; }
    .issue-row .col-desc { color: var(--text-secondary); }
    .issue-row-expand {
      padding: 6px 10px 10px 22px; border-top: 1px solid rgba(148,163,184,0.1);
      background: rgba(255,255,255,0.25);
    }
    .loc-bar {
      display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; font-size: 0.72rem; color: var(--muted);
    }
    .loc-bar span strong { color: var(--text); font-weight: 600; }
    pre.code-snippet {
      background: rgba(15,23,42,0.88); color: #e2e8f0; padding: 8px 10px; border-radius: 7px;
      font-size: 0.72rem; line-height: 1.45; margin: 0; overflow-x: auto; white-space: pre-wrap;
    }

    /* 五、详细 issue 块 */
    article.issue-detail {
      padding: 11px 13px; margin-bottom: 7px; border-radius: 9px;
      background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.52);
      border-left: 3px solid rgba(148,163,184,0.35);
    }
    article.issue-detail.sev-critical { border-left-color: var(--critical); }
    article.issue-detail.sev-high { border-left-color: var(--high); }
    article.issue-detail.sev-medium { border-left-color: var(--medium); }
    article.issue-detail.sev-low { border-left-color: var(--low); }
    article.issue-detail h4 { margin: 0 0 8px; font-size: 0.86rem; font-weight: 700; }
    .loc-table { margin: 4px 0 6px; font-size: 0.76rem; }
    .loc-table th { width: 68px; background: rgba(241,245,249,0.85); padding: 3px 7px; }
    .loc-table td { padding: 3px 7px; }
    .issue-label { font-weight: 600; margin: 7px 0 3px; color: var(--muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; }
    pre.code {
      background: rgba(15,23,42,0.88); color: #e2e8f0; padding: 9px 11px; border-radius: 7px;
      overflow-x: auto; font-size: 0.72rem; margin: 0 0 6px; line-height: 1.45; white-space: pre-wrap;
    }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82em; }

    .btn-detail {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px;
      background: rgba(99,102,241,0.08); color: var(--accent); cursor: pointer; flex-shrink: 0;
    }
    .btn-detail:hover { background: rgba(99,102,241,0.18); }
    .btn-detail svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

    .stack-text { margin: 0; font-size: 0.8rem; line-height: 1.55; color: var(--text-secondary); }

    /* 七、签收表单 */
    .signoff-form { font-size: 0.8rem; }
    .signoff-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 12px;
    }
    .signoff-grid label { display: flex; flex-direction: column; gap: 4px; }
    .signoff-grid label span { font-size: 0.68rem; color: var(--muted); font-weight: 600; }
    .signoff-grid input, .signoff-grid select {
      padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(148,163,184,0.35);
      background: rgba(255,255,255,0.65); font-size: 0.8rem;
    }
    .signoff-grid input[readonly] { background: rgba(241,245,249,0.8); color: var(--text-secondary); }
    .signoff-remarks-wrap { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; grid-column: 1 / -1; }
    .signoff-remarks-label { font-size: 0.68rem; color: var(--muted); font-weight: 600; }
    .signoff-remarks {
      width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.35); background: rgba(255,255,255,0.65);
      font-size: 0.82rem; line-height: 1.5; resize: vertical; font-family: inherit;
    }
    .signoff-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-primary, .btn-secondary {
      padding: 8px 16px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: none;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; }
    .btn-secondary { background: rgba(148,163,184,0.15); color: var(--text); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .signoff-hint { font-size: 0.68rem; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
    .signoff-toast {
      margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.75rem;
      background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #166534;
    }
    .signoff-toast.error { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.2); color: #991b1b; }
    /* 签收结果（Fix 版第六、七节） */
    .result-tag {
      display: inline-block; font-size: 0.64rem; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      min-width: 1.6em; text-align: center; line-height: 1.2;
    }
    .result-tag.yes { background: rgba(34,197,94,0.16); color: #166534; }
    .result-tag.no { background: rgba(148,163,184,0.14); color: var(--muted); }
    table.signoff-result { margin-top: 4px; }
    table.signoff-result th { width: 36%; white-space: nowrap; }
    table.signoff-result td { color: var(--text); font-weight: 500; }
    body.signed .signoff-form,
    body.signed .signoff-actions,
    body.signed .signoff-hint,
    body.signed .signoff-toast,
    body.signed #signoff-submit { display: none !important; }
    body.signed .cb-valid, body.signed .cb-fixed,
    body.signed .chk-label { display: none !important; }
    body.signed details.issue-row > summary { cursor: default; }
    body.signed details.issue-row[open] > summary { border-bottom: none; }
    .signed-banner {
      display: none; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px;
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
      font-size: 0.78rem; font-weight: 600; color: #166534;
    }
    body.signed .signed-banner { display: block; }

    .modal { display: none; position: fixed; inset: 0; z-index: 1000; }
    .modal.open { display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,0.34); }
    .modal-dialog {
      position: relative; max-width: 680px; width: 100%; max-height: 85vh;
      display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(203,213,225,0.8); box-shadow: 0 18px 42px rgba(15,23,42,0.16);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.98) translateY(4px); } to { opacity: 1; transform: none; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(148,163,184,0.12); }
    .modal-header h3 { margin: 0; font-size: 0.88rem; font-weight: 700; }
    .modal-close { background: rgba(148,163,184,0.12); border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; cursor: pointer; color: var(--muted); }
    .modal-body { padding: 14px; overflow-y: auto; flex: 1; }

    footer.report-footer { margin-top: 16px; text-align: left; font-size: 0.68rem; color: var(--muted); }

    @media (max-width: 768px) {
      .meta-cards { grid-template-columns: repeat(3, 1fr); }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .signoff-grid { grid-template-columns: 1fr; }
      .issue-list-header { display: none; }
      .issue-list { min-width: 640px; }
      details.issue-row > summary {
        grid-template-columns: 14px 28px 58px minmax(88px,1.2fr) 36px 36px 24px;
      }
      .issue-row .col-fn, .issue-row .col-author, .issue-row .col-must, .issue-row .col-desc, .issue-row .col-sev { display: none; }
      details.issue-row > summary .btn-detail { grid-column: 7; }
    }
  </style>
</head>
<body>
  <script type="application/json" id="report-meta">{{REPORT_META_JSON}}</script>
  <div class="page">
    <header class="report-header">
      <h1>{{REPORT_TITLE}}</h1>
      <p class="subtitle">前端增量代码检视报告</p>
    </header>
    <div class="meta-cards">{{META_SUMMARY}}</div>
    <nav class="toc" id="toc"><h2>目录</h2><!-- 有序列表 ol --></nav>
    <main class="report-body" id="report-body">{{BODY_HTML}}</main>
    <footer class="report-footer">报告由 ato-code-review-web skill 自动生成 · {{GENERATED_AT}}</footer>
  </div>

  <div id="issue-modal" class="modal" aria-hidden="true" role="dialog">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="issue-modal-title">问题详情</h3>
        <button type="button" class="modal-close" aria-label="关闭" data-close="true">&times;</button>
      </div>
      <div class="modal-body" id="issue-modal-body"></div>
    </div>
  </div>

  <script>
    (function () {
      var DEFAULT_REMARKS = '上述问题无需修复';
      // 本地时间 ISO（带时区偏移），签收时间使用用户本地时间而非 UTC
      function localIso() {
        var d = new Date();
        function pad(n) { return String(n).length < 2 ? '0' + n : String(n); }
        var off = -d.getTimezoneOffset();
        var sign = off >= 0 ? '+' : '-';
        var abs = Math.abs(off);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
          'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
          sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
      }
      var ICON = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1"/></svg>';
      var modal = document.getElementById('issue-modal');

      function getMeta() {
        var el = document.getElementById('report-meta');
        var base = { mdFile: '', htmlFile: '', baseName: '' };
        if (!el || !el.textContent.trim() || el.textContent.indexOf('{{') >= 0) {
          var p = location.pathname.split('/').pop() || 'report.html';
          base.htmlFile = p;
          base.baseName = p.replace(/\.html$/i, '');
          base.mdFile = base.baseName + '.md';
          return base;
        }
        try { return Object.assign(base, JSON.parse(el.textContent)); } catch (e) { return base; }

        document.querySelectorAll('.btn-detail:not([data-icon])').forEach(function (btn) {

      function initClipTitles() {
        document.querySelectorAll('.col-loc, .col-fn, .col-author, .col-desc').forEach(function (el) {

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      function renderSignedSection6() {
        var issues = collectIssues();

      function collectContributors(issues) {

      function updateSignoffStats() {
        var issues = collectIssues();
        var valid = issues.filter(function (i) { return i.valid; });
        var fixed = issues.filter(function (i) { return i.fixed; });
        var deferred = valid.filter(function (i) { return !i.fixed; });
        var total = issues.length;
        var elValid = document.getElementById('signoff-valid-count');
        var elFixed = document.getElementById('signoff-fixed-count');
        var elAll = document.getElementById('signoff-all-fixed');
        var elDef = document.getElementById('signoff-deferred-count');
        if (elValid) elValid.value = String(valid.length);
        if (elFixed) elFixed.value = String(fixed.length);
        if (elAll) {
          if (!valid.length) elAll.value = '—';
          else elAll.value = fixed.length === valid.length ? '是' : '否';
        }
        if (elDef) elDef.value = String(deferred.length);
        var contributors = collectContributors(issues);
        var elContrib = document.getElementById('signoff-contributors');
        if (elContrib) elContrib.value = contributors.length ? contributors.join('、') : '—';
        var hint = document.querySelector('#section-signoff .collapse-meta');
        if (hint) hint.textContent = valid.length + ' 有效 · ' + deferred.length + ' 遗留';

      function patchMd(md, payload) {
        var issues = payload.issues || [];
        var byId = {};
        issues.forEach(function (i) { byId[i.id] = i; });
        var lines = md.split('\n');
        var inTable = false;
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf('## 六、问题清单') === 0) inTable = false;
          if (line.indexOf('| 问题 ID |') >= 0 && line.indexOf('详情') >= 0) {
            if (line.indexOf('有效') < 0) lines[i] = line.replace('| 详情 |', '| 有效 | 已修复 | 详情 |');
            inTable = true; continue;
          }
          if (inTable && line.indexOf('|---') === 0 && line.indexOf('有效') < 0) {
            lines[i] = line.replace('|------|', '|------|------|');
            continue;
          }
          if (inTable && line.charAt(0) === '|' && line.indexOf('问题 ID') < 0) {
            var m = line.match(/\|\s*\d+\s*\|\s*([A-Z]+-\d+)/);
            if (m && byId[m[1]]) {
              var rec = byId[m[1]];
              var valid = rec.valid ? '是' : '否';
              var fixed = rec.fixed ? '是' : '否';
              if (line.indexOf('[查看]') >= 0) {
                lines[i] = line.replace(/\|\s*\[查看\]/, '| ' + valid + ' | ' + fixed + ' | [查看]');
              }
            }
          }
          if (inTable && line.indexOf('## ') === 0 && line.indexOf('六、') < 0) break;
        }
        md = lines.join('\n');
        var fields = {
          '检视结论': payload.conclusion || '—',
          '开发负责人（签收人）': payload.signer || '—',
          '签收人': payload.signer || '—',
          '有效问题个数': String(payload.validCount != null ? payload.validCount : '—'),
          '是否全部已修复': payload.allFixed || '—',
          '遗留下个版本问题数': String(payload.deferredCount != null ? payload.deferredCount : '—'),
          '本次参与开发': payload.contributors || '—',
          '签收时间': (payload.signedAt || '—').replace('T', ' ').slice(0, 19),
          '备注': (payload.remarks || DEFAULT_REMARKS).trim() || DEFAULT_REMARKS
        };
        var start = md.indexOf('## 七、验证与签收');
        if (start < 0) start = md.indexOf('## 七、检视结论与签收');
        if (start < 0) start = md.indexOf('## 七、备注');
        if (start < 0) return md;
        var end = md.indexOf('\n---', start);
        if (end < 0) end = md.length;
        var block = md.slice(start, end);
        Object.keys(fields).forEach(function (key) {
          var re = new RegExp('(\\|\\s*' + key + '\\s*\\|)\\s*([^|]*)(\\|)');
          block = block.replace(re, '$1 ' + fields[key] + ' $3');
        });
        return md.slice(0, start) + block + md.slice(end);
      }

      function tableFromElement(table) {
        if (!table) return '';
        var lines = [];
        table.querySelectorAll('tr').forEach(function (tr) {
          var cells = Array.prototype.map.call(tr.querySelectorAll('th,td'), function (c) {
            return (c.textContent || '').trim().replace(/\|/g, '\\|');
          });
          if (cells.length) lines.push('| ' + cells.join(' | ') + ' |');
        });
        return lines.join('\n');
      }

      function generateMdFromHtml(payload) {

        var byId = {};
        (payload.issues || []).forEach(function (i) { byId[i.id] = i; });
        var sevMap = { C: 'Critical', H: 'High', M: 'Medium', L: 'Low' };

        });
        var signedAt = (payload.signedAt || '—').replace('T', ' ').slice(0, 19);
        return [
          '# ' + title, '',

          tableFromElement(document.querySelector('#section-files table')) || '（见 HTML 报告）', '',
          '---', '',
          '## 三、问题汇总统计', '',
          statLines.join('\n'), '',

          '## 四、技术栈与检视依据', '',

          '---', '',
          '## 五、详细检视结果', '',
          detailParts.length ? detailParts.join('\n') : '（见 HTML 报告）', '',
          '---', '',
          '## 六、问题清单（全量）', '',
          '> Critical / High 在「必改」列标记 **是**。', '',
          issueLines.join('\n'), '',
          '---', '',
          '## 七、验证与签收', '',
          '| 项目 | 内容 |', '|------|------|',
          '| 检视结论 | ' + (payload.conclusion || '—') + ' |',
          '| 开发负责人（签收人） | ' + (payload.signer || '—') + ' |',
          '| 有效问题个数 | ' + (payload.validCount != null ? payload.validCount : '—') + ' |',
          '| 是否全部已修复 | ' + (payload.allFixed || '—') + ' |',
          '| 遗留下个版本问题数 | ' + (payload.deferredCount != null ? payload.deferredCount : '—') + ' |',
          '| 本次参与开发 | ' + (payload.contributors || '—') + ' |',
          '| 签收时间 | ' + signedAt + ' |',

      function downloadFile(name, content, mime) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([content], { type: mime || 'text/plain' }));
        a.download = name;
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
      }

      // Linux Chromium/GTK 的 showSaveFilePicker 常忽略 suggestedName（空白文件名）
      function isLinuxDesktop() {
        var ua = navigator.userAgent || '';
        return /Linux/i.test(ua) && !/Android/i.test(ua);
      }

      // 保留中文仓库/分支名，仅清理各桌面系统都禁止的文件名字符
      function safeSaveName(name) {
        return String(name || 'report')
          .replace(/[\u0000-\u001f\u007f]/g, '_')
          .replace(/[\/\\:*?"<>|]+/g, '_')
          .replace(/[. ]+$/g, '') || 'report';
      }

      async function saveFile(name, content, mime) {
        if (!isLinuxDesktop() && window.showSaveFilePicker) {
          try {
            var ext = (String(name).split('.').pop() || 'txt').toLowerCase();
            var handle = await window.showSaveFilePicker({
              suggestedName: safeSaveName(name),
              types: [{ description: 'File', accept: { [mime || 'text/plain']: ['.' + ext] } }]
            });
            var w = await handle.createWritable();
            await w.write(content);
            await w.close();
            return 'saved';
          } catch (e) {
            if (e && e.name === 'AbortError') return 'cancel';
          }
        }
        downloadFile(name, content, mime);
        return 'download';
      }

      function buildFixHtml(payload) {
        renderSignedSection6();
        renderSignedSection7(payload || {});
        document.body.classList.add('signed');
        document.body.setAttribute('data-signed', 'true');
        var t = document.querySelector('title');
        if (t && t.textContent.indexOf('【Fix】') !== 0) t.textContent = '【Fix】' + t.textContent;
        return '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }

      function showToast(msg, isErr) {
        var t = document.getElementById('signoff-toast');
        if (!t) return;
        t.hidden = false;
        t.textContent = msg;
        t.classList.toggle('error', !!isErr);
      }

      function storageKey() { return 'ato-signoff-' + getMeta().baseName; }
      function saveDraft() {
        try {
          localStorage.setItem(storageKey(), JSON.stringify({
            signer: (document.getElementById('signoff-signer') || {}).value,
            conclusion: (document.getElementById('signoff-conclusion') || {}).value,
            remarks: getRemarks(),
            issues: collectIssues()
          }));
        } catch (e) {}
      }
      function loadDraft() {
        try {
          var d = JSON.parse(localStorage.getItem(storageKey()) || 'null');
          if (!d) return;
          if (d.signer && document.getElementById('signoff-signer')) document.getElementById('signoff-signer').value = d.signer;
          if (d.conclusion && document.getElementById('signoff-conclusion')) document.getElementById('signoff-conclusion').value = d.conclusion;
          if (d.remarks && document.getElementById('signoff-remarks')) document.getElementById('signoff-remarks').value = d.remarks;
          (d.issues || []).forEach(function (rec) {
            var row = document.querySelector('details.issue-row[data-issue-id="' + rec.id + '"]');
            if (!row) return;
            var v = row.querySelector('.cb-valid');
            var f = row.querySelector('.cb-fixed');
            if (v) v.checked = !!rec.valid;
            if (f) f.checked = !!rec.fixed;
          });
        } catch (e) {}
      }

      async function onSignoffSubmit(e) {
        e.preventDefault();
        var meta = getMeta();
        var signer = (document.getElementById('signoff-signer') || {}).value.trim();
        if (!signer) { showToast('请填写开发负责人', true); return; }
        var issues = collectIssues();
        var contributors = collectContributors(issues);
        var valid = issues.filter(function (i) { return i.valid; });
        var fixed = issues.filter(function (i) { return i.fixed; });
        var deferred = valid.filter(function (i) { return !i.fixed; });
        var signedAt = localIso();
        var payload = {
          mdPath: meta.mdFile, htmlPath: meta.htmlFile, baseName: meta.baseName,
          signer: signer,
          conclusion: (document.getElementById('signoff-conclusion') || {}).value || '—',
          validCount: valid.length,
          fixedCount: fixed.length,
          allFixed: !valid.length ? '—' : (fixed.length === valid.length ? '是' : '否'),
          deferredCount: deferred.length,
          contributors: contributors.length ? contributors.join('、') : '—',
          remarks: getRemarks(),
          signedAt: signedAt,
          issues: issues
        };
        var timeEl = document.getElementById('signoff-time');
        if (timeEl) timeEl.value = signedAt.replace('T', ' ').slice(0, 19);
        updateSignoffStats();

        var mdText = null;
        try {
          var mdUrl = meta.mdFile || (meta.baseName + '.md');
          var res = await fetch(mdUrl);
          if (res.ok) mdText = await res.text();
        } catch (err) {}

        var msgs = [];
        var mdOut = null;
        if (mdText) mdOut = patchMd(mdText, payload);
        else mdOut = generateMdFromHtml(payload);
        var mdResult = await saveFile(meta.baseName + '.md', mdOut, 'text/markdown');
        if (mdResult === 'saved') msgs.push('已保存 MD');
        else if (mdResult === 'download') msgs.push(mdText ? '已下载更新后的 MD' : '已根据 HTML 生成并下载 MD');

        payload.fixHtml = buildFixHtml(payload);
        var fixName = '【Fix】' + meta.baseName + '.html';
        var htmlResult = await saveFile(fixName, payload.fixHtml, 'text/html');
        if (htmlResult === 'saved') msgs.push('已保存 ' + fixName);
        else if (htmlResult === 'download') msgs.push('已下载 ' + fixName);

        try { localStorage.removeItem(storageKey()); } catch (e2) {}
        showToast(msgs.join(' · '), false);
        var btn = document.getElementById('signoff-submit');
        if (btn) btn.disabled = true;
      }

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.btn-detail');
        if (btn && btn.dataset.issueId) { e.preventDefault(); e.stopPropagation(); openIssue(btn.dataset.issueId); return; }
        if (e.target.closest('[data-close="true"]')) closeModal();
        if (e.target.closest('.col-chk')) e.stopPropagation();
      });
      document.addEventListener('change', function (e) {
        if (e.target.matches('.cb-valid, .cb-fixed')) {
          updateRowStyles();
          updateSignoffStats();
          saveDraft();
        }
        if (e.target.id === 'signoff-remarks') saveDraft();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

      var form = document.getElementById('signoff-form');
      if (form) form.addEventListener('submit', onSignoffSubmit);
      var remarksEl = document.getElementById('signoff-remarks');
      if (remarksEl && !remarksEl.value.trim()) remarksEl.value = DEFAULT_REMARKS;

      initDetailButtons();
      initClipTitles();
      loadDraft();
      if (remarksEl && !remarksEl.value.trim()) remarksEl.value = DEFAULT_REMARKS;
      updateRowStyles();
      updateSignoffStats();
    })();
  </script>
</body>
</html>
<!-- ato-codereview-html-end -->
