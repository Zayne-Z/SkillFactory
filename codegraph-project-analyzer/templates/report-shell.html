<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20242b;
      --muted: #647084;
      --line: #dfe5ee;
      --soft: #f5f7fa;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-ink: #0b4f4a;
      --blue: #2454d6;
      --green: #13803d;
      --amber: #9a6400;
      --red: #b42318;
      --gray: #596579;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #eef2f6;
    }
    .layout-shell { min-height: 100vh; }
    .report-hero {
      padding: 30px 32px 22px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .report-hero-inner { max-width: 1180px; margin: 0 auto; }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 28px 60px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.06);
    }
    h1 { margin: 0; font-size: 31px; line-height: 1.22; letter-spacing: 0; }
    h2 {
      margin: 34px 0 14px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      font-size: 22px;
      letter-spacing: 0;
    }
    h3 { margin: 24px 0 10px; font-size: 17px; letter-spacing: 0; }
    p, li { line-height: 1.72; }
    .meta { color: var(--muted); margin-top: 8px; font-size: 13px; }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      margin: 14px 0 20px;
      font-size: 14px;
      display: block;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
    th:not(:last-child), td:not(:last-child) { border-right: 1px solid var(--line); }
    tr:last-child td { border-bottom: none; }
    thead th { background: #f2f5f9; font-weight: 650; color: #344054; }
    tbody tr:nth-child(even) { background: #fafbfc; }
    blockquote {
      margin: 12px 0 18px;
      padding: 10px 14px;
      border-left: 4px solid var(--accent);
      background: #edf7f5;
      color: var(--accent-ink);
    }
    hr { border: none; border-top: 1px solid var(--line); margin: 30px 0; }
    a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    code {
      background: var(--soft);
      padding: 1px 5px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    pre {
      overflow-x: auto;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101828;
    }
    pre code { color: #f2f4f7; background: transparent; padding: 0; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .status-completed { color: var(--green); background: #eaf7ef; }
    .status-pending { color: var(--amber); background: #fff5df; }
    .status-selected, .status-in-progress { color: var(--blue); background: #edf3ff; }
    .status-failed { color: var(--red); background: #fff0ee; }
    .status-skipped { color: var(--gray); background: #f0f2f5; }
    @media (max-width: 760px) {
      .report-hero { padding: 22px 18px 16px; }
      main { padding: 18px 16px 42px; box-shadow: none; }
      h1 { font-size: 25px; }
      h2 { font-size: 20px; }
      th, td { padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <div class="layout-shell">
    <header class="report-hero">
      <div class="report-hero-inner">
        <h1>{{REPORT_TITLE}}</h1>
        <div class="meta">Generated at {{GENERATED_AT}}</div>
      </div>
    </header>
    <main>
{{BODY_HTML}}
    </main>
  </div>
</body>
</html>
<!-- codegraph-project-analyzer-html-end -->
